<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>崩铁排轴计算工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="./assets/hsr-tool/logo.png" alt="" class="brand-logo" />
          <div>
            <div class="brand-title">星铁排轴</div>
            <div class="brand-subtitle">Action Value Planner</div>
          </div>
        </div>
        <nav class="side-nav" aria-label="工具导航">
          <a class="nav-item active" href="./index.html">行动轴计算</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>崩坏：星穹铁道排轴计算</h1>
            <p>角色、敌人、翁瓦克、舞舞舞与阿哈时刻实时排序。</p>
          </div>
          <div class="limit-control" role="group" aria-label="行动轴上限">
            <button class="segment" data-limit="150">150</button>
            <button class="segment active" data-limit="300">300</button>
            <button class="segment" data-limit="600">600</button>
          </div>
        </header>

        <section class="workspace">
          <div class="config-column">
            <section class="panel">
              <div class="panel-head">
                <h2>配置保存</h2>
                <button id="saveConfig" class="icon-text-button" type="button">保存</button>
              </div>
              <div class="config-save">
                <input id="configName" type="text" placeholder="方案名称" />
                <select id="configSelect"></select>
                <button id="loadConfig" class="icon-text-button" type="button">加载</button>
                <button id="deleteConfig" class="icon-text-button danger" type="button">删除</button>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>我方站位与速度</h2>
                <span class="panel-meta">输入角色名或下拉选择，同 AV 按站位</span>
              </div>
              <div class="table-wrap">
                <div class="unit-table ally-table">
                  <div class="table-row table-header">
                    <span>位</span>
                    <span>角色</span>
                    <span>面板</span>
                    <span>百分比</span>
                    <span>固定</span>
                    <span>最终</span>
                    <span>翁瓦克</span>
                    <span>拉条</span>
                    <span>目标 / 比例</span>
                    <span></span>
                  </div>
                  <div id="allyControls"></div>
                </div>
              </div>
            </section>

            <section class="panel aha-panel">
              <div class="panel-head">
                <h2>阿哈时刻</h2>
                <label class="switch">
                  <input id="showAha" type="checkbox" checked />
                  <span>显示</span>
                </label>
              </div>
              <div class="aha-value compact-aha">
                <span>速度</span>
                <strong id="ahaSpeed">80</strong>
              </div>
              <div id="ahaDetail" class="aha-detail"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>敌人行动</h2>
                <div class="panel-actions">
                  <div id="enemyPhaseTabs" class="phase-tabs" role="group" aria-label="敌人面数"></div>
                  <button id="addEnemy" class="icon-text-button" type="button">+ 敌人</button>
                </div>
              </div>
              <div class="table-wrap">
                <div class="unit-table enemy-table">
                  <div class="table-row table-header">
                    <span>#</span>
                    <span>名称</span>
                    <span>速度</span>
                    <span>AV</span>
                    <span></span>
                  </div>
                  <div id="enemyControls"></div>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>转面设置</h2>
                <div class="panel-actions">
                  <button id="togglePhaseColumns" class="icon-text-button" type="button">分列</button>
                  <button id="addTransition" class="icon-text-button" type="button">+ 转面</button>
                  <label class="switch">
                    <input id="transitionEnabled" type="checkbox" />
                    <span>启用</span>
                  </label>
                </div>
              </div>
              <div id="transitionControls" class="transition-list"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>拉条插件</h2>
                <button id="addSupport" class="icon-text-button" type="button" draggable="true" data-drag-dance="new" title="拖入行动轴">+ 舞舞舞</button>
              </div>
              <div class="drag-source" draggable="true" data-drag-dance="new" title="拖入行动轴">
                <span class="support-badge">舞</span>
                <span>舞舞舞</span>
                <span>24%</span>
              </div>
              <div id="supportControls" class="support-list"></div>
            </section>
          </div>

          <div class="workspace-resizer" id="workspaceResizer" aria-label="调整左右宽度" role="separator"></div>

          <div class="result-column">
            <section class="panel axis-panel">
              <div class="panel-head">
                <div>
                  <h2>行动轴</h2>
                  <span id="axisMeta" class="panel-meta"></span>
                </div>
                <label class="switch">
                  <input id="showTimelineSpeed" type="checkbox" />
                  <span>速度</span>
                </label>
              </div>
              <div id="timeline" class="timeline"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <datalist id="characterOptions"></datalist>
    <script src="./character-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
