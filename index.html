<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>崩铁排轴</title>
    <link rel="icon" type="image/png" href="./assets/other/logo.png" />
    <link rel="stylesheet" href="./styles.css?v=20260530-2" />
  </head>
  <body>
    <div class="app-shell sidebar-collapsed">
      <aside class="sidebar">
        <button id="collapseSidebar" class="sidebar-toggle" type="button" title="收起侧栏" aria-label="收起侧栏">&lt;</button>
        <div class="brand">
          <img src="./assets/other/logo.png" alt="" class="brand-logo" />
          <div>
            <div class="brand-title">崩铁排轴</div>
            <div class="brand-subtitle">Action Value Planner</div>
          </div>
        </div>
        <nav class="side-nav" aria-label="工具导航">
          <a class="nav-item active" href="./index.html">行动轴计算</a>
        </nav>
      </aside>
      <button id="expandSidebar" class="sidebar-expand" type="button" title="展开侧栏" aria-label="展开侧栏">&gt;</button>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>崩铁排轴</h1>
            <p>角色、敌人、翁瓦克、舞舞舞与阿哈时刻实时排序。</p>
          </div>
          <div class="limit-control" role="group" aria-label="行动轴上限">
            <button class="segment" data-limit="150">150</button>
            <button class="segment active" data-limit="300">300</button>
            <button class="segment" data-limit="600">600</button>
          </div>
        </header>

        <section class="workspace">
          <div class="config-column">
            <section class="panel">
              <div class="panel-head">
                <h2>配置保存</h2>
                <div class="panel-actions">
                  <button id="newConfig" class="icon-text-button" type="button">新建</button>
                  <button id="saveConfig" class="icon-text-button" type="button">保存</button>
                </div>
              </div>
              <div class="config-save">
                <input id="configName" type="text" placeholder="方案名称" />
                <select id="configSelect"></select>
                <button id="loadConfig" class="icon-text-button" type="button">加载</button>
                <button id="deleteConfig" class="icon-text-button danger" type="button">删除</button>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>我方站位与速度</h2>
                <span class="panel-meta">输入角色名或下拉选择，同 AV 按站位</span>
              </div>
              <div class="table-wrap">
                <div class="unit-table ally-table">
                  <div class="table-row table-header">
                    <span>位</span>
                    <span>角色</span>
                    <span>面板</span>
                    <span>百分比</span>
                    <span>固定</span>
                    <span>最终</span>
                    <span>翁瓦克</span>
                    <span>拉条</span>
                    <span>默认目标 / 比例</span>
                  </div>
                  <div id="allyControls"></div>
                </div>
              </div>
            </section>

            <section class="panel aha-panel">
              <div class="panel-head">
                <h2>阿哈时刻</h2>
                <span class="panel-meta">欢愉命途自动加入行动轴</span>
              </div>
              <div class="aha-value compact-aha">
                <span>速度</span>
                <strong id="ahaSpeed">80</strong>
              </div>
              <div id="ahaDetail" class="aha-detail"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>敌人行动</h2>
                <div class="panel-actions">
                  <div id="enemyPhaseTabs" class="phase-tabs" role="group" aria-label="敌人面数"></div>
                  <button id="addEnemy" class="icon-text-button" type="button">+ 敌人</button>
                </div>
              </div>
              <div class="table-wrap">
                <div class="unit-table enemy-table">
                  <div class="table-row table-header">
                    <span>#</span>
                    <span>名称</span>
                    <span>速度</span>
                    <span>AV</span>
                    <span></span>
                  </div>
                  <div id="enemyControls"></div>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>转面设置</h2>
                <div class="panel-actions">
                  <button id="togglePhaseColumns" class="icon-text-button" type="button">分列</button>
                  <button id="addTransition" class="icon-text-button" type="button">+ 转面</button>
                  <label class="switch">
                    <input id="transitionEnabled" type="checkbox" />
                    <span>启用</span>
                  </label>
                </div>
              </div>
              <div id="transitionControls" class="transition-list"></div>
            </section>

          </div>

          <div class="workspace-resizer" id="workspaceResizer" aria-label="调整左右宽度" role="separator"></div>

          <div class="result-column axis-workbench">
            <section class="panel axis-panel">
              <div class="panel-head">
                <div>
                  <h2>行动轴</h2>
                  <span id="axisMeta" class="panel-meta"></span>
                </div>
                <label class="switch">
                  <input id="showTimelineSpeed" type="checkbox" />
                  <span>速度</span>
                </label>
              </div>
              <div id="timeline" class="timeline"></div>
            </section>
            <aside class="plugin-palette" aria-label="行动轴插件">
              <div class="plugin-palette-head">
                <h2>插件</h2>
              </div>
              <div class="plugin-grid">
                <div class="effect-card dance" draggable="true" data-drag-effect="dance" title="拖入行动轴">
                  <span class="support-badge">舞</span>
                  <strong>舞舞舞</strong>
                  <span>全队拉条 24%</span>
                </div>
                <div class="effect-card pull" draggable="true" data-drag-effect="pull" title="拖到角色或敌人行动上">
                  <span class="effect-badge">拉</span>
                  <strong>拉条</strong>
                  <span>单次行动 0%</span>
                </div>
                <div class="effect-card push" draggable="true" data-drag-effect="push" title="拖到角色或敌人行动上">
                  <span class="effect-badge">推</span>
                  <strong>推条</strong>
                  <span>单次行动 0%</span>
                </div>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <datalist id="characterOptions"></datalist>
    <script src="./character-data.js?v=20260530-2"></script>
    <script src="./app.js?v=20260530-2"></script>
  </body>
</html>
